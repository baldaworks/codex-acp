name: release

on:
  push:
    tags:
      - "codex-acp/v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve upstream version
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version=$(./scripts/release-version.sh "$RELEASE_REF")
          echo "OMNIDIST_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Test
        run: go test -race ./...

      - name: Lint
        run: go tool golangci-lint run

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="${OMNIDIST_VERSION}"
          if [[ -z "${version}" ]]; then
            echo "OMNIDIST_VERSION is required"
            exit 1
          fi

          binary="codex-acp"
          main_pkg="./cmd/codex-acp"
          mkdir -p dist

          targets=(
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"${target}"
            artifact="${binary}-v${version}-${goos}-${goarch}"
            workdir="dist/${artifact}"
            mkdir -p "${workdir}"

            out_name="${binary}"
            if [[ "${goos}" == "windows" ]]; then
              out_name="${out_name}.exe"
            fi

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X github.com/baldaworks/codex-acp/internal/version.buildVersion=${OMNIDIST_VERSION}" -o "${workdir}/${out_name}" "${main_pkg}"
            cp README.md LICENSE "${workdir}/"

            tar -C dist -czf "dist/${artifact}.tar.gz" "${artifact}"
            rm -rf "${workdir}"
          done

          (
            cd dist
            sha256sum ./*.tar.gz > checksums.txt
          )

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
