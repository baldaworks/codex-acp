# Generated by "omnidist ci". Re-run the command to refresh this workflow.
name: omnidist-release
on:
  push:
    tags:
      - "v*"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install omnidist
        run: npm install -g '@omnidist/omnidist@0.1.31'
      - name: Build artifacts
        run: omnidist --profile 'codex-acp-bridge' build
      - name: Stage artifacts
        run: omnidist --profile 'codex-acp-bridge' npm stage
      - name: Set npm package description
        run: >-
          npm pkg set
          'description=Run Codex as an Agent Client Protocol (ACP) agent.'
          --prefix '.omnidist/codex-acp-bridge/npm/@normahq/codex-acp-bridge'
      - name: Verify artifacts
        run: omnidist --profile 'codex-acp-bridge' npm verify
      - name: Pack staged artifacts
        run: tar -czf omnidist-staged.tgz .omnidist/codex-acp-bridge
      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnidist-staged
          path: omnidist-staged.tgz
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: .omnidist/codex-acp-bridge/dist/**/*
          if-no-files-found: error

  publish_npm:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install omnidist
        run: npm install -g '@omnidist/omnidist@0.1.31'
      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          name: omnidist-staged
      - name: Restore staged artifacts
        run: tar -xzf omnidist-staged.tgz
      - name: Verify artifacts
        run: omnidist --profile 'codex-acp-bridge' npm verify
      - name: Publish npm artifacts
        run: omnidist --profile 'codex-acp-bridge' npm publish
