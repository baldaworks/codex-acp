profiles:
  codex-acp:
    tool:
      name: codex-acp
      main: ./cmd/codex-acp
    readme-path: ./README.md
    version:
      source: env
    targets:
      - os: darwin
        arch: amd64
      - os: darwin
        arch: arm64
      - os: linux
        arch: amd64
      - os: linux
        arch: arm64
      - os: windows
        arch: amd64
    build:
      ldflags: -s -w -X github.com/baldaworks/codex-acp/internal/version.buildVersion=${OMNIDIST_VERSION}
      tags: []
      cgo: false
    distributions:
      npm:
        package: codex-acp
        platform-package: '@baldaworks/codex-acp'
        description: Run Codex as an Agent Client Protocol (ACP) agent.
        registry: https://registry.npmjs.org
        repository-url: git+https://github.com/baldaworks/codex-acp
        publish-auth: trusted
        access: public
        include-readme: true
        keywords:
          - ai
          - llm
          - codex
          - acp
          - mcp
          - agent
          - bridge
          - cli
